background {
    monitor =
    path = /home/mrsypz/.config/hypr/walls/1.jpg
    oblur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

# Profie-Photo
image {
    monitor =
    path = /home/mrsypz/Pictures/avatar.jpg
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 40
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, 350
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(253, 198, 135, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Password</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Music blur div
shape {
    monitor =
    size = 540, 110
    color = $primary_7_rgba
    rounding = 20
    position = 10, -310
    halign = center
    valign = center
    zindex = 1
}

# PLAYER TITLE (with music note icon for title)
label {
    monitor =
    text = cmd[update:1000] echo "󰎈$(/home/mrsypz/.config/hypr/config/scripts/songdetail.sh --title)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold, Noto Sans
    position = 1030, -310
    text_align = left
    halign = left
    valign = center
    zindex = 5
}

# PLAYER ARTIST (with microphone icon for artist/singer)
label {
    monitor =
    text = cmd[update:1000] echo "󰳩 $(/home/mrsypz/.config/hypr/config/scripts/songdetail.sh --artist)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 10
    font_family = JetBrains Mono Nerd Font Mono ExtraBold, Noto Sans
    position = 1030, -340
    halign = left
    valign = center
    zindex = 5
}

# PLAYER LENGTH (with clock icon for total duration)
label {
    monitor =
    text = cmd[update:1000] echo "󰥔 $(/home/mrsypz/.config/hypr/config/scripts/songdetail.sh --length)"
    color = rgba(255, 255, 255, 1)
    font_size = 11
    font_family = JetBrains Mono Nerd Font Mono, Noto Sans
    position = 240, -340
    halign = center
    valign = center
    zindex = 5
}

# PLAYER SOURCE (keep as-is or add icon if you want, e.g., globe for web)
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/mrsypz/.config/hypr/config/scripts/songdetail.sh --source)"
    color = rgba(255, 255, 255, 0.6)
    font_size = 10
    font_family = JetBrains Mono Nerd Font Mono, Noto Sans
    position = 1030, -280
    text_align = left
    halign = left
    valign = center
    zindex = 5
};

# TEMP
label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = $color7
    font_size = 18
    font_family = Geist Mono 10

    position = 0, 40
    halign = center
    valign = bottom
}

# KEYBOARD LANGUAGE
label {
  monitor =
  text = $LAYOUT
  color = rgb(205, 214, 244)
  font_family = JetBrains Mono
  font_size = 18
  position = -20, 10
  halign = right
  valign = bottom
}
